name: Security

on:
  schedule:
    # Every Monday at 09:00 Paris time (08:00 UTC)
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (fail on high/critical)
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # Only scan source code, not build artifacts or node_modules
          config: |
            paths:
              - app
              - lib
            paths-ignore:
              - node_modules
              - .next

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  # Note: Dependabot auto-merge is handled by dependabot-auto-merge.yml
  # (triggered on pull_request events). A job here would never run because
  # this workflow is triggered only by schedule and workflow_dispatch — at
  # which point github.actor is 'github-actions[bot]', not 'dependabot[bot]',
  # and github.event.pull_request is empty.
