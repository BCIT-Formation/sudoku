name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      pr: ${{ steps.release.outputs.pr }}

    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: node

  # Auto-enable merge on the release PR as soon as CI is green.
  # release-please-action@v4 outputs `pr` as a JSON object — extract html_url.
  auto-merge-release-pr:
    name: Auto-merge release PR
    runs-on: ubuntu-latest
    needs: release-please
    # Only run when release-please created/updated a PR (not after creating a release)
    if: needs.release-please.outputs.pr != '' && needs.release-please.outputs.release_created != 'true'

    steps:
      - name: Enable auto-merge on release PR
        run: |
          gh pr merge --auto --squash \
            "${{ fromJSON(needs.release-please.outputs.pr).html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
